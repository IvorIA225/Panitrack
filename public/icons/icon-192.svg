    <ellipse cx="76" cy="76" rx="68" ry="24" transform="rotate(-30 76 76)" fill="url(#goldGrad192)"/>
    
    <!-- Baguette Scars -->
    <path d="M36 96 Q46 88 52 78" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M58 82 Q68 74 74 64" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M80 68 Q90 60 96 50" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M102 54 Q112 46 118 36" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Title PT -->
  <text x="96" y="162" text-anchor="middle" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">
    Pani<tspan fill="#f59e0b">Track</tspan>
