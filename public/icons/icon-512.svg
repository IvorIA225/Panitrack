<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="4"/>

  <!-- Bakery Oven Glow Behind -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Bread Loaves Icon (Graphic) -->
  <g transform="translate(100, 90)" filter="url(#glow)">
    <!-- Cart / Tray Base -->
    <path d="M40 230 L272 230 C280 230 286 236 286 244 L286 250 C286 258 280 264 272 264 L40 264 C32 264 26 258 26 250 L26 244 C26 236 32 230 40 230 Z" fill="url(#accentGrad)" opacity="0.8"/>
    
    <!-- Baguette 1 (Main diagonal golden loaf) -->
    <ellipse cx="156" cy="140" rx="145" ry="46" transform="rotate(-30 156 140)" fill="url(#goldGrad)"/>
    
    <!-- Baguette Scars (Incision cuts) -->
    <path d="M70 185 Q90 170 100 150" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M115 155 Q135 140 145 120" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M165 125 Q185 110 195 90" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M215 95 Q235 80 245 60" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Wheat spike accent -->
    <path d="M280 180 Q305 135 285 100" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: PaniTrack -->
  <text x="256" y="420" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    Pani<tspan fill="#f59e0b">Track</tspan>
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="4">
    SUIVI DE SHIFT BOULANGERIE
  </text>
</svg>
